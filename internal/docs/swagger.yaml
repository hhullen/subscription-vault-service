        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/datastruct.Status'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/datastruct.Status'
      summary: List subscriptions
      tags:
      - Subscriptions
  /subscriptions/total_price:
    get:
      description: Calculate price of subscriptions.
      parameters:
      - description: start_date
        example: 31.12.2006
        in: query
        name: start_date
        required: true
        type: string
      - description: end_date
        example: 31.12.2008
        in: query
        name: end_date
        required: true
        type: string
      - description: service_name
        example: Poople
        in: query
        name: service_name
        type: string
      - description: user_uid
        example: 4988150e-1c82-490f-8c07-ee74ace2dd14
        in: query
        name: user_uid
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/datastruct.CalculateSubscriptionsPriceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/datastruct.Status'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/datastruct.Status'
      summary: Calculate price of subscriptions
      tags:
      - Subscriptions
