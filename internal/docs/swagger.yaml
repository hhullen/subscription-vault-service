paths:
  /subscriptions:
    delete:
      consumes:
      - application/json
      description: Delete subscription.
      parameters:
      - description: Subscription
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/datastruct.DeleteSubscriptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/datastruct.DeleteSubscriptionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/datastruct.Status'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/datastruct.Status'
      summary: Delete subscription
      tags:
      - Subscriptions
    get:
      description: Get subscription.
      parameters:
      - description: service_name
        example: Poople
        in: query
        name: service_name
        required: true
        type: string
      - description: user_uid
        example: 4988150e-1c82-490f-8c07-ee74ace2dd14
        in: query
        name: user_uid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/datastruct.GetSubscriptionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/datastruct.Status'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/datastruct.Status'
      summary: Get subscription
      tags:
      - Subscriptions
    patch:
      consumes:
      - application/json
      description: Update subscription.
      parameters:
      - description: Subscription
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/datastruct.UpdateSubscriptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/datastruct.UpdateSubscriptionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/datastruct.Status'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/datastruct.Status'
      summary: Update subscription
      tags:
      - Subscriptions
    post:
      consumes:
      - application/json
      description: Create new subscription.
      parameters:
      - description: Subscription
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/datastruct.CreateSubscriptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/datastruct.CreateSubscriptionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/datastruct.Status'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/datastruct.Status'
      summary: Create new subscription
      tags:
      - Subscriptions
  /subscriptions/list:
    get:
      description: List subscriptions.
      parameters:
      - description: user_uid
        example: 4988150e-1c82-490f-8c07-ee74ace2dd14
        in: query
        name: user_uid
        required: true
        type: string
      produces:
      - application/json
      responses:
